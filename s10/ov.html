<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}
body{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:"Inter Display","Inter",sans-serif;color:#fff}
.a{position:absolute}.y{color:#FFD23F}
.top{left:0;top:0;width:1080px;height:520px;background:#0E0A1A}
.bot{left:0;top:1330px;width:1080px;height:590px;background:#0E0A1A}
.ln{left:0;width:1080px;height:7px;background:#FFD23F;box-shadow:0 0 22px rgba(255,210,63,.7)}
.row{left:48px;right:48px;top:150px;display:flex;align-items:center;justify-content:space-between}
.pill{display:flex;align-items:center;gap:12px;background:#F0506E;padding:10px 22px 10px 16px;border-radius:12px;font-weight:900;font-size:36px;letter-spacing:.08em;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.logo{display:flex;flex-direction:column;align-items:flex-end}
.logo .p{background:#E4477A;padding:3px 12px;border-radius:8px;font-weight:900;font-size:28px}
.logo .n{font-weight:900;font-size:32px;margin-top:2px}
.title{left:40px;right:40px;top:250px;height:250px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;letter-spacing:-2px;line-height:1.02;text-transform:uppercase}
.disc{left:0;right:0;top:1350px;text-align:center;font-family:Inter;font-weight:600;font-size:24px;color:#9C93B0;letter-spacing:.04em}
.cur{left:56px;width:860px;top:1405px}
.cur .k{display:flex;align-items:center;gap:14px;font-weight:800;font-size:28px;letter-spacing:.24em;color:#FFD23F}
.cur .dots{display:flex;gap:8px}.cur .dots i{width:34px;height:8px;border-radius:4px;background:#3A3150}.cur .dots i.on{background:#FFD23F}
.q{left:56px;right:56px;top:1400px;text-align:left;font-weight:900;font-size:66px;line-height:1.04;letter-spacing:-1px}
.q .k{font-weight:800;font-size:28px;letter-spacing:.24em;color:#FFD23F;margin-bottom:14px}
.cur .t{margin-top:16px;font-weight:900;font-size:58px;line-height:1.05;letter-spacing:-1px}
</style></head><body><div id="r"></div><script>
const P=new URLSearchParams(location.search),S=P.get('s'),V=P.get('v');
const D={
loja:{t:'No GTA 6 você<br><span class="y">prova a roupa</span><br>antes de comprar',c:['A loja fica num evento de lama no interior, com regata, short e boné','Você vê o preço e testa a peça no Jason: <span class="y">regata $29</span>, <span class="y">bermuda $32</span>','Tem botão de <span class="y">comprar e já sair vestido</span> 👕']},
moto:{t:'Vazou a <span class="y">corrida de<br>motocross</span> do GTA 6',c:['São <span class="y">14 pilotos</span>, 2 voltas e cronômetro na tela','Caminhonetes off-road <span class="y">pulam a pista</span> no meio da corrida 😳','A moto é alugada, e cada uma tem atributos de <span class="y">velocidade e off-road</span>']},
tuning:{t:'Vazou a <span class="y">oficina<br>de tuning</span> do GTA 6',c:['Tem kit pronto de corrida de rua e <span class="y">pintura fosca</span>','Motor stage 2, <span class="y">supercharger</span>, câmbio e <span class="y">nitro</span> 🔥','E dá até pra <span class="y">envelopar o carro com anime</span> 👀']},
tuningS:{t:'Vazou a <span class="y">oficina<br>de tuning</span> do GTA 6',q:['Nitro, supercharger, pintura fosca e até <span class="y">envelopamento de anime</span> 👀','<span class="y">Nitro ou supercharger?</span><br>Comenta 👇']},
rachaS:{t:'Vazou o <span class="y">racha<br>de rua</span> do GTA 6',q:['Encontro com neon e <span class="y">racha em grupo</span> pelas ruas de Vice City 🏁','<span class="y">Qual carro você levava pro racha?</span> Comenta 👇']},
racha:{t:'Vazou o <span class="y">racha<br>de rua</span> do GTA 6',c:['Encontro de carros à noite, com <span class="y">neon embaixo</span> dos carros','Corrida em grupo com <span class="y">6 carros</span> pelas ruas de Vice City','Dá pra correr em <span class="y">primeira pessoa</span>, vendo o painel 🏁']}};
const d=D[S];let h='';
if(V==='base'){
 const fs=d.t.replace(/<[^>]+>/g,'').length>34?84:94;
 h=`<div class="a top"></div><div class="a ln" style="top:513px"></div><div class="a bot"></div><div class="a ln" style="top:1330px"></div>
 <div class="a row"><div class="pill"><span>🚨</span>VAZOU</div><div class="logo"><div class="p">PLANTÃO</div><div class="n">LEONIDA</div></div></div>
 <div class="a title" style="font-size:${fs}px"><div>${d.t}</div></div>
 <div class="a disc">imagens vazadas · versão de teste · pode mudar no lançamento</div>`;
}else if(V[0]==='q'){
 const n=+V.slice(1);
 h=`<div class="a q"><div class="k">${n===1?'VAZAMENTO':'E VOCÊ?'}</div>${d.q[n-1]}</div>`;
}else{
 const n=+V;
 h=`<div class="a cur"><div class="k">CURIOSIDADE <div class="dots">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div></div><div class="t">${d.c[n-1]}</div></div>`;
}
document.getElementById('r').innerHTML=h;
</script></body></html>
