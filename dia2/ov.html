<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}
body{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:"Inter Display","Inter",sans-serif;color:#fff}
.abs{position:absolute}
.y{color:#FFD23F}
/* card */
.frame{left:36px;top:556px;width:1008px;height:570px;border:9px solid #FFD23F;border-radius:20px;box-shadow:0 0 40px rgba(255,210,63,.55),0 0 0 3px #1B1430 inset}
.tab{left:70px;top:520px;height:66px;padding:0 26px 0 20px;background:#FFD23F;color:#1B1430;border-radius:12px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:30px;letter-spacing:.22em;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.tab svg{width:30px;height:34px}
.count{right:52px;top:494px;font-weight:900;font-size:76px;letter-spacing:-2px;-webkit-text-stroke:10px #1B1430;paint-order:stroke fill;}
.panel{left:45px;top:565px;width:990px;height:552px;border-radius:12px;background:linear-gradient(100deg,rgba(14,10,26,0) 46%,rgba(14,10,26,.78) 62%,rgba(14,10,26,.92) 100%)}
.ribbon{right:58px;top:612px;background:#E4477A;color:#fff;font-weight:800;font-size:27px;letter-spacing:.18em;padding:12px 22px;transform:rotate(3deg);box-shadow:0 6px 16px rgba(0,0,0,.45);border-radius:6px}
.ptxt{left:690px;top:700px;width:330px}
.ptxt .k{font-weight:700;font-size:20px;letter-spacing:.12em;color:#FFD23F;margin-bottom:6px}
.ptxt .t{font-weight:900;font-size:50px;line-height:.98;letter-spacing:-1px;text-transform:uppercase}
.ptxt .d{margin-top:14px;font-family:Inter;font-weight:600;font-size:22px;line-height:1.3;color:#EDE6F2}
/* below card */
.cat{left:0;right:0;top:1158px;text-align:center;font-weight:800;font-size:30px;letter-spacing:.32em;color:#FFD23F;-webkit-text-stroke:6px #1B1430;paint-order:stroke fill}
.big{left:30px;right:30px;top:1196px;text-align:center;font-weight:900;font-size:92px;line-height:1;letter-spacing:-2px;text-transform:uppercase;-webkit-text-stroke:14px #1B1430;paint-order:stroke fill;text-shadow:0 8px 20px rgba(0,0,0,.6)}
.line{left:90px;right:90px;height:6px;background:#FFD23F;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.sub{left:0;right:0;text-align:center;font-family:Inter;font-weight:800;font-size:40px;-webkit-text-stroke:8px #1B1430;paint-order:stroke fill}
/* stack */
.stack{left:30px;right:30px;top:1150px;display:flex;flex-direction:column;align-items:center}
.cat2{font-weight:800;font-size:30px;letter-spacing:.32em;color:#FFD23F;-webkit-text-stroke:6px #1B1430;paint-order:stroke fill}
.big2{margin-top:2px;text-align:center;font-weight:900;line-height:.98;letter-spacing:-2px;text-transform:uppercase;-webkit-text-stroke:14px #1B1430;paint-order:stroke fill;text-shadow:0 8px 20px rgba(0,0,0,.6)}
.line2{margin-top:14px;width:86%;height:6px;background:#FFD23F;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.sub2{margin-top:10px;text-align:center;font-family:Inter;font-weight:800;font-size:40px;-webkit-text-stroke:8px #1B1430;paint-order:stroke fill}
/* chrome */
.badge{left:34px;top:250px;display:flex;align-items:center;gap:22px}
.badge .b{width:78px;height:78px;border-radius:16px;background:#FFD23F;color:#1B1430;font-weight:900;font-size:50px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.badge .l{font-weight:800;font-size:34px;letter-spacing:.12em;-webkit-text-stroke:6px #1B1430;paint-order:stroke fill}
.logo{right:40px;top:246px;display:flex;flex-direction:column;align-items:center;opacity:.9}
.logo .p{background:#E4477A;padding:4px 14px;border-radius:8px;font-weight:900;font-size:30px;letter-spacing:-.5px}
.logo .n{font-weight:900;font-size:34px;letter-spacing:-.5px;-webkit-text-stroke:6px #1B1430;paint-order:stroke fill;margin-top:2px}
/* table */
.tt{left:0;right:0;top:560px;text-align:center;font-weight:900;font-size:84px;letter-spacing:-1px;-webkit-text-stroke:14px #1B1430;paint-order:stroke fill}
.tbl{left:44px;right:44px;top:680px;background:rgba(20,16,36,.93);border-radius:22px;border:3px solid rgba(255,255,255,.12);padding:18px 22px 10px;box-shadow:0 20px 50px rgba(0,0,0,.55)}
.row{display:grid;grid-template-columns:1fr 220px 220px;align-items:center;min-height:98px;border-bottom:2px solid rgba(255,255,255,.08);font-family:Inter;font-weight:800;font-size:36px}
.row:last-child{border-bottom:0}
.hd{min-height:84px}
.pill{justify-self:center;font-family:"Inter Display";font-weight:900;font-size:30px;padding:8px 14px;border-radius:10px;color:#1B1430}
.ok,.no{justify-self:center;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ok{background:#2BD47D}.no{background:#F0506E}
.ok svg,.no svg{width:34px;height:34px}
/* extra */
.xcard{left:44px;right:44px;top:600px;background:rgba(20,16,36,.94);border:9px solid #FFD23F;border-radius:22px;padding:30px 34px;box-shadow:0 0 40px rgba(255,210,63,.5)}
.xrow{display:flex;align-items:center;gap:26px;padding:22px 0;border-bottom:2px solid rgba(255,255,255,.1)}
.xrow:last-child{border-bottom:0}
.xic{width:92px;height:92px;border-radius:18px;background:#E4477A;display:flex;align-items:center;justify-content:center;font-size:52px;flex:none}
.xt{font-weight:900;font-size:50px;letter-spacing:-1px;text-transform:uppercase;line-height:1}
.xd{font-family:Inter;font-weight:600;font-size:28px;color:#EDE6F2;margin-top:6px}
/* hook/outro */
.h1{left:30px;right:30px;text-align:center;font-weight:900;letter-spacing:-2px;line-height:1;-webkit-text-stroke:16px #1B1430;paint-order:stroke fill;text-shadow:0 10px 24px rgba(0,0,0,.6)}
.vs{display:flex;gap:26px;justify-content:center}
.vs div{font-weight:900;font-size:64px;padding:14px 30px;border-radius:16px;color:#1B1430;box-shadow:0 10px 26px rgba(0,0,0,.5)}
</style></head><body><div id="root"></div>

R.innerHTML=h;
</script></body></html>
